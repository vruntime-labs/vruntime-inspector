<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-labelledby="t d">
<title id="t">Evidence classification model</title><desc id="d">Four stacked isometric evidence blocks represent Observed, Derived, Inferred, and Unknown.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f35"/><stop offset="1" stop-color="#07111f"/></linearGradient></defs><rect width="1500" height="420" rx="22" fill="url(#bg)"/>
<g font-family="Arial,sans-serif">
<g transform="translate(75 95)"><path d="M0 55 120 0 240 55 120 110Z" fill="#285f71" stroke="#91edff" stroke-width="3"/><path d="M0 55v100l120 55V110Z" fill="#123a4d" stroke="#67d9f2" stroke-width="2"/><path d="M240 55v100l-120 55V110Z" fill="#174d62" stroke="#67d9f2" stroke-width="2"/><text x="120" y="69" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">OBSERVED</text><text x="285" y="55" fill="#dffaff" font-size="23" font-weight="700">Directly present</text><text x="285" y="88" fill="#91adc4" font-size="17">Extracted from an artifact or authorized capture.</text></g>
<g transform="translate(75 195)"><path d="M0 55 120 0 240 55 120 110Z" fill="#315b87" stroke="#9bc7ff" stroke-width="3"/><path d="M0 55v75l120 55V110Z" fill="#1a345b" stroke="#7fb4f4" stroke-width="2"/><path d="M240 55v75l-120 55V110Z" fill="#234577" stroke="#7fb4f4" stroke-width="2"/><text x="120" y="69" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">DERIVED</text><text x="555" y="55" fill="#e5f0ff" font-size="23" font-weight="700">Computed from evidence</text><text x="555" y="88" fill="#91adc4" font-size="17">Deterministic relationships and calculations.</text></g>
<g transform="translate(75 285)"><path d="M0 45 120 0 240 45 120 90Z" fill="#755b35" stroke="#ffd18a" stroke-width="3"/><path d="M0 45v48l120 48V90Z" fill="#503d2c" stroke="#efb96c" stroke-width="2"/><path d="M240 45v48l-120 48V90Z" fill="#60492e" stroke="#efb96c" stroke-width="2"/><text x="120" y="59" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">INFERRED</text><text x="825" y="48" fill="#fff0d9" font-size="23" font-weight="700">Hypothesis to review</text><text x="825" y="80" fill="#bba98f" font-size="17">Heuristics or AI-assisted interpretation.</text></g>
<g transform="translate(75 375)"><path d="M0 25 120 0 240 25 120 50Z" fill="#4a5260" stroke="#c1ccd8" stroke-width="2"/><text x="120" y="32" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">UNKNOWN</text><text x="1095" y="25" fill="#e1e8ef" font-size="23" font-weight="700">Not established</text></g>
</g></svg>