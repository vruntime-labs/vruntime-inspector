name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: npm run check
      - name: Run unit and integration tests
        run: npm test
      - name: Verify Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/vruntime-inspector-worker
